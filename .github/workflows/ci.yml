name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run vendor
      - name: Verify reader assets
        run: test -s public/index.html && test -s public/vendor/jszip.min.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t carl-reader:test .
      - name: Start container
        run: docker run -d --name carl-reader -p 3000:3000 -e OPENAI_API_KEY=test-key -e READER_PASSWORD=test-pass carl-reader:test
      - name: Wait for health
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs carl-reader
          exit 1
      - name: Verify homepage
        run: curl -fsS http://127.0.0.1:3000/ | grep -q 'Carl Reader'
      - name: Verify auth protection
        run: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"text":"Ciao"}' http://127.0.0.1:3000/api/translate)" = "401"
