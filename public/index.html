<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171614"><title>Carl Reader</title><style>:root{--bg:#171614;--paper:#f3ecdf;--ink:#29251f;--muted:#8f887d;--accent:#b84b43}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eee}.top{position:sticky;top:0;z-index:4;background:#171614e8;backdrop-filter:blur(14px);padding:max(12px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid #ffffff16}.row{display:flex;gap:9px;align-items:center;max-width:760px;margin:auto}.brand{font-weight:700;flex:1}.btn{border:0;border-radius:12px;padding:10px 13px;background:#302d29;color:#eee;font-weight:650}.btn.primary{background:var(--accent)}.file{display:none}.setup{max-width:720px;margin:28px auto;padding:0 18px}.setupbox{padding:24px;border:1px solid #ffffff1b;border-radius:22px;background:#201e1b}.setup h1{margin-top:0}.status{color:#bbb;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}select,input[type=password]{background:#2a2723;color:#eee;border:1px solid #ffffff20;border-radius:11px;padding:11px;max-width:100%}.reader{display:none;max-width:720px;margin:22px auto 100px;padding:0 14px}.paper{background:var(--paper);color:var(--ink);min-height:70vh;border-radius:18px;padding:clamp(25px,6vw,54px);box-shadow:0 18px 60px #0008}.chapter{font:600 12px/1.2 -apple-system;text-transform:uppercase;letter-spacing:.12em;color:#8b7e6c;margin-bottom:28px}.text{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.72;white-space:pre-wrap}.nav{display:flex;justify-content:space-between;align-items:center;margin:16px 4px}.progress{font-size:13px;color:#aaa}.translated .paper{background:#f6f0e6}@media(max-width:500px){.paper{border-radius:0;margin:0 -14px}.reader{margin-top:0}.top .brand{font-size:14px}}</style></head><body><header class="top"><div class="row"><div class="brand">Carl Reader</div><button id="original" class="btn" hidden>Original</button><button id="translate" class="btn primary" hidden>Deutsch</button></div></header><section id="setup" class="setup"><div class="setupbox"><h1>EPUB öffnen</h1><p>Das Buch wird lokal im Browser geöffnet. Nur der Textblock, den du übersetzen lässt, geht an den Server.</p><label class="btn primary" for="epub">EPUB auswählen</label><input id="epub" class="file" type="file" accept=".epub,application/epub+zip"><div id="status" class="status">Bereit.</div><div class="controls"><select id="chapter" hidden></select><input id="password" type="password" placeholder="Reader-Passwort (falls gesetzt)"></div></div></section><main id="reader" class="reader"><div class="nav"><button id="prev" class="btn">‹ Zurück</button><span id="progress" class="progress"></span><button id="next" class="btn">Weiter ›</button></div><article class="paper"><div id="chapterTitle" class="chapter"></div><div id="text" class="text"></div></article></main><script src="/vendor/jszip.min.js"></script><script>const $=id=>document.getElementById(id);let sections=[],index=0,originalText='',translated=false;const cache=new Map();$('epub').onchange=async e=>{try{$('status').textContent='EPUB wird geöffnet …';const file=e.target.files[0];if(!file)return;if(!window.JSZip)throw Error('EPUB-Bibliothek fehlt');const zip=await JSZip.loadAsync(file);const container=await zip.file('META-INF/container.xml')?.async('text');if(!container)throw Error('Ungültige EPUB: container.xml fehlt');const cp=new DOMParser().parseFromString(container,'application/xml').querySelector('rootfile')?.getAttribute('full-path');if(!cp)throw Error('EPUB-Paketdatei nicht gefunden');const opfText=await zip.file(cp)?.async('text');const opf=new DOMParser().parseFromString(opfText,'application/xml'),base=cp.includes('/')?cp.slice(0,cp.lastIndexOf('/')+1):'',manifest={};opf.querySelectorAll('manifest item').forEach(x=>manifest[x.id]=x.getAttribute('href'));sections=[];for(const ref of opf.querySelectorAll('spine itemref')){const href=manifest[ref.getAttribute('idref')];if(!href)continue;const p=norm(base+href.split('#')[0]),zf=zip.file(p);if(!zf)continue;const html=await zf.async('text'),doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style').forEach(n=>n.remove());const text=(doc.body?.innerText||doc.body?.textContent||'').replace(/\n{3,}/g,'\n\n').trim();if(text.length<40)continue;sections.push({title:(doc.querySelector('h1,h2,h3')?.textContent||`Abschnitt ${sections.length+1}`).trim(),text})}if(!sections.length)throw Error('Keine lesbaren Abschnitte gefunden');const c=$('chapter');c.innerHTML='';sections.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${s.title}`;c.appendChild(o)});c.hidden=false;$('setup').style.display='none';$('reader').style.display='block';$('translate').hidden=$('original').hidden=false;index=Number(localStorage.getItem('carl-reader-index')||0);if(index>=sections.length)index=0;c.value=index;show();}catch(err){$('status').textContent='Fehler: '+err.message}};$('chapter').onchange=()=>{index=+$('chapter').value;show()};$('prev').onclick=()=>{if(index>0){index--;show()}};$('next').onclick=()=>{if(index<sections.length-1){index++;show()}};$('original').onclick=()=>{translated=false;render(originalText)};$('translate').onclick=async()=>{const key='v1:'+index;if(cache.has(key)){translated=true;return render(cache.get(key))}const b=$('translate');b.disabled=true;b.textContent='Übersetze …';try{const r=await fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json','x-reader-password':$('password').value},body:JSON.stringify({text:originalText.slice(0,9500)})}),j=await r.json();if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);cache.set(key,j.translation);localStorage.setItem('carl-trans-'+index,j.translation);translated=true;render(j.translation)}catch(e){alert('Übersetzung: '+e.message)}finally{b.disabled=false;b.textContent='Deutsch'}};function show(){localStorage.setItem('carl-reader-index',index);$('chapter').value=index;const s=sections[index];originalText=s.text;$('chapterTitle').textContent=s.title;$('progress').textContent=`${index+1} / ${sections.length}`;const saved=localStorage.getItem('carl-trans-'+index);if(saved)cache.set('v1:'+index,saved);translated=false;render(originalText);scrollTo({top:0,behavior:'instant'})}function render(t){$('text').textContent=t;$('reader').classList.toggle('translated',translated)}function norm(p){const a=[];for(const x of decodeURIComponent(p).split('/')){if(x==='..')a.pop();else if(x!=='.'&&x!=='')a.push(x)}return a.join('/')}</script></body></html>
